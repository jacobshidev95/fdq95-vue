services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdq95}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdq95_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fdq95_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fdq95} -d $${POSTGRES_DB:-fdq95_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

# VoiceStudio TTS 服务（可选）
  voicestudio:
    image: ghcr.io/debpalash/voicestudio:latest
    container_name: fdq95-voicestudio
    ports:
      - "8000:8000"
    environment:
      - VOICESTUDIO_HOST=0.0.0.0
      - VOICESTUDIO_PORT=8000
    volumes:
      - voicestudio_data:/root/.voicestudio
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  libretranslate:
    image: libretranslate/libretranslate:v1.6.0
    container_name: libretranslate
    restart: unless-stopped
    environment:
      LT_DEBUG: "false"
      LT_UPDATE_MODELS: "true"
      LT_SSL: "false"
      LT_SUGGESTIONS: "false"
      LT_METRICS: "false"
      LT_HOST: "0.0.0.0"
      LT_API_KEYS: "false"
      LT_THREADS: "4"
      LT_LOAD_ONLY: "en,zh,es,fr,de,ja,ko,ar"
    volumes:
      - libretranslate_models:/home/libretranslate/.local:rw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "./venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\""
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    # ★★★ 关键改动：改为 ./backend/.env
    #     这是后端专属的 env 文件，包含 AI 视频 / LLM / LTX-2 的 key
    #     根目录的 .env 依然通过下方 ${VAR} 语法为其它变量提供值
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      - LIBRETRANSLATE_API_KEY=${LIBRETRANSLATE_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # ★ Whisper ASR 配置
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_CACHE=/root/.cache/huggingface
    volumes:
      - uploads:/app/uploads                     # 文章/视频资源持久化
      - whisper_cache:/root/.cache/huggingface   # Whisper 模型缓存
      - piper_models:/models
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8094:80"

volumes:
  pgdata:
  libretranslate_models:
  uploads:
  whisper_cache:
  piper_models:
  voicestudio_data:
  ai_video_outputs: