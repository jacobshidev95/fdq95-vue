services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdq95}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdq95_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fdq95_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdq95}"]
      interval: 5s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:v1.6.0
    container_name: libretranslate
    restart: unless-stopped
    environment:
      LT_DEBUG: "false"
      LT_UPDATE_MODELS: "true"
      LT_SSL: "false"
      LT_SUGGESTIONS: "false"
      LT_METRICS: "false"
      LT_HOST: "0.0.0.0"
      LT_API_KEYS: "false"
      LT_THREADS: "4"
      LT_LOAD_ONLY: "en,zh,es,fr,de,ja,ko,ar"
    volumes:
      - libretranslate_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/languages || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      - LIBRETRANSLATE_API_KEY=${LIBRETRANSLATE_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  libretranslate_models: